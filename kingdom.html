<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>왕국 건설기 — 마을에서 제국까지</title>
<meta name="description" content="초가 오두막에서 시작해 궁궐을 세우고 대제국을 이루는 방치형 왕국 건설 게임.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700;900&family=Gowun+Dodum&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#16241c;
    --parchment:#f3e8ca;
    --parchment-dim:#e7d8ac;
    --parchment-line:#d8c48f;
    --ink:#2c2013;
    --ink-soft:#5b4d38;
    --gold:#c99a2e;
    --gold-bright:#e3b74a;
    --emerald:#2f5d50;
    --emerald-deep:#1f4038;
    --burgundy:#9e2a2b;
    --sky-a:#dfe9c9;
    --sky-b:#a9c9b8;
    --accent:#b9862f;
    --accent-deep:#7c5a1f;
    --radius-s:6px;
    --radius-m:10px;
    --font-display:'Noto Serif KR', Georgia, serif;
    --font-body:'Nanum Gothic', 'Gowun Dodum', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg-deep);
    font-family:var(--font-body);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:18px 16px 60px;}
  ::selection{background:var(--accent);color:#fff;}
  button{font-family:inherit;}
  :focus-visible{outline:3px solid var(--gold-bright);outline-offset:2px;}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--parchment);padding:6px 4px 14px;flex-wrap:wrap;}
  .kingdom-id{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .kingdom-name{font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:0.2px;color:var(--parchment);}
  .age-name{font-size:13px;color:var(--sky-a);background:rgba(255,255,255,0.08);padding:3px 10px;border-radius:20px;font-weight:700;}
  .stats-strip{display:flex;gap:18px;align-items:center;flex-wrap:wrap;}
  .stat{display:flex;align-items:center;gap:7px;}
  .stat svg{width:20px;height:20px;flex-shrink:0;color:var(--gold-bright);}
  .stat .num{font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--parchment);font-variant-numeric:tabular-nums;}
  .stat .sub{font-size:11px;color:var(--sky-a);opacity:0.85;}
  .stat.pop svg{color:var(--sky-a);}

  .scene-panel{position:relative;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,0.08);box-shadow:0 10px 30px rgba(0,0,0,0.35);}
  .scene-sky{position:relative;height:230px;background:linear-gradient(180deg,var(--sky-a),var(--sky-b));transition:background 1.1s ease;overflow:hidden;}
  body[data-age="town"] .scene-sky{background:linear-gradient(180deg,#f3e3b0,#c9b884);}
  body[data-age="city"] .scene-sky{background:linear-gradient(180deg,#f2c98d,#c98a5e);}
  body[data-age="capital"] .scene-sky{background:linear-gradient(180deg,#7d6aa3,#4a3d6b);}
  body[data-age="empire"] .scene-sky{background:linear-gradient(180deg,#1b1740,#0c0b22);}
  .stars{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease;}
  body[data-age="empire"] .stars{opacity:1;}
  .stars span{position:absolute;width:2px;height:2px;background:#f3e8ca;border-radius:50%;}

  .hills-far{position:absolute;left:0;right:0;bottom:0;height:70%;background:var(--emerald);opacity:0.35;clip-path:polygon(0 60%,15% 40%,32% 55%,50% 30%,68% 52%,86% 38%,100% 55%,100% 100%,0 100%);}
  .hills-near{position:absolute;left:0;right:0;bottom:0;height:52%;background:var(--emerald-deep);opacity:0.55;clip-path:polygon(0 70%,20% 50%,40% 68%,60% 45%,80% 66%,100% 48%,100% 100%,0 100%);}

  .castle{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);cursor:pointer;border:0;background:none;padding:0;filter:drop-shadow(0 6px 8px rgba(0,0,0,0.25));}
  .castle:active svg{transform:scale(0.96);}
  .castle svg{width:150px;height:130px;display:block;transition:transform 0.08s ease;}
  .castle .stage-hut{display:inline;}
  .castle .stage-palace{display:none;}
  body[data-age="city"] .castle .stage-hut, body[data-age="capital"] .castle .stage-hut, body[data-age="empire"] .castle .stage-hut{display:none;}
  body[data-age="city"] .castle .stage-palace, body[data-age="capital"] .castle .stage-palace, body[data-age="empire"] .castle .stage-palace{display:inline;}
  .castle .tower-extra{display:none;}
  body[data-age="city"] .castle .tower-extra, body[data-age="capital"] .castle .tower-extra, body[data-age="empire"] .castle .tower-extra{display:inline;}
  .castle .flag{display:none;}
  body[data-age="capital"] .castle .flag, body[data-age="empire"] .castle .flag{display:inline;}
  .castle .wall{display:none;}
  body[data-age="town"] .castle .wall, body[data-age="city"] .castle .wall, body[data-age="capital"] .castle .wall, body[data-age="empire"] .castle .wall{display:inline;}

  .click-tag{position:absolute;pointer-events:none;font-family:var(--font-display);font-weight:700;color:var(--gold-bright);text-shadow:0 1px 2px rgba(0,0,0,0.5);animation:floatup 0.85s ease-out forwards;font-size:15px;}
  @keyframes floatup{0%{opacity:1;transform:translateY(0);}100%{opacity:0;transform:translateY(-46px);}}
  .scene-flash{position:absolute;inset:0;background:var(--gold-bright);opacity:0;pointer-events:none;}
  .scene-flash.flashing{animation:flashpop 0.9s ease-out;}
  @keyframes flashpop{0%{opacity:0.55;}100%{opacity:0;}}

  .collect-bar{background:var(--parchment);border-top:1px solid var(--parchment-line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .collect-bar .hint{font-size:13px;color:var(--ink-soft);}
  .btn-collect{background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:var(--radius-m);font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 2px 0 var(--accent-deep);}
  .btn-collect:active{transform:translateY(1px);box-shadow:0 1px 0 var(--accent-deep);}

  .board{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-top:16px;}
  @media (max-width:820px){.board{grid-template-columns:1fr;}}
  .panel{background:var(--parchment);border-radius:14px;border:1px solid var(--parchment-line);padding:14px;}
  .panel h2{font-family:var(--font-display);font-size:18px;margin:2px 0 12px;color:var(--ink);display:flex;align-items:center;gap:8px;}
  .panel h2 .count-badge{font-family:var(--font-body);font-size:11px;font-weight:800;color:var(--ink-soft);background:var(--parchment-dim);padding:2px 8px;border-radius:20px;}

  .b-list, .u-list{display:flex;flex-direction:column;gap:8px;}
  .b-card{display:flex;align-items:center;gap:12px;background:#fbf6e6;border:1px solid var(--parchment-line);border-radius:var(--radius-m);padding:10px 12px;}
  .b-icon{width:42px;height:42px;flex-shrink:0;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(47,93,80,0.12);}
  .b-icon svg{width:24px;height:24px;stroke:var(--emerald);}
  .b-card.hue-gold .b-icon{background:rgba(201,154,46,0.16);}
  .b-card.hue-gold .b-icon svg{stroke:var(--gold);}
  .b-card.hue-burgundy .b-icon{background:rgba(158,42,43,0.13);}
  .b-card.hue-burgundy .b-icon svg{stroke:var(--burgundy);}
  .b-info{flex:1;min-width:0;}
  .b-name{font-family:var(--font-display);font-weight:600;font-size:15px;color:var(--ink);}
  .b-meta{font-size:12px;color:var(--ink-soft);margin-top:1px;}
  .b-owned{font-size:11px;font-weight:800;color:var(--ink-soft);margin-top:2px;}
  .b-buy{display:flex;flex-direction:column;align-items:stretch;gap:2px;flex-shrink:0;}
  .b-buy button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 12px;font-weight:800;font-size:13px;cursor:pointer;min-width:92px;box-shadow:0 2px 0 var(--accent-deep);}
  .b-buy button:disabled{background:#c9c0a4;box-shadow:none;cursor:not-allowed;color:#8a806b;}
  .b-buy button:not(:disabled):active{transform:translateY(1px);box-shadow:none;}
  .b-card.locked{filter:grayscale(0.5);opacity:0.6;}
  .b-card.locked .b-buy button{visibility:hidden;}
  .locked-note{font-size:11px;color:var(--burgundy);font-weight:700;}

  .u-card{background:#fbf6e6;border:1px solid var(--parchment-line);border-radius:var(--radius-m);padding:10px 12px;}
  .u-card.owned{background:rgba(47,93,80,0.10);border-color:var(--emerald);}
  .u-top{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .u-name{font-family:var(--font-display);font-weight:600;font-size:14.5px;}
  .u-desc{font-size:12px;color:var(--ink-soft);margin-top:3px;}
  .u-buy{background:var(--gold);color:#fff;border:none;border-radius:8px;padding:7px 12px;font-weight:800;font-size:12.5px;cursor:pointer;flex-shrink:0;box-shadow:0 2px 0 #9a7317;}
  .u-buy:disabled{background:#c9c0a4;box-shadow:none;cursor:not-allowed;color:#8a806b;}
  .u-owned-tag{font-size:11px;font-weight:800;color:var(--emerald);flex-shrink:0;}
  .empty-note{font-size:13px;color:var(--ink-soft);padding:8px 2px;}

  .prestige-panel{margin-top:16px;}
  .prestige-panel.hidden{display:none;}
  .prestige-box{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
  .prestige-box p{margin:4px 0 0;font-size:12.5px;color:var(--ink-soft);max-width:60ch;}
  .btn-prestige{background:var(--burgundy);color:#fff;border:none;border-radius:10px;padding:11px 18px;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 2px 0 #6b1c1d;}
  .btn-prestige:disabled{background:#c9c0a4;box-shadow:none;cursor:not-allowed;color:#8a806b;}

  .footer-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:var(--sky-a);font-size:11.5px;flex-wrap:wrap;gap:8px;}
  .link-btn{background:none;border:none;color:var(--sky-a);text-decoration:underline;font-size:11.5px;cursor:pointer;padding:0;font-family:inherit;}

  .modal-veil{position:fixed;inset:0;background:rgba(15,20,15,0.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .modal-veil.hidden{display:none;}
  .modal-card{background:var(--parchment);border-radius:16px;padding:26px;max-width:420px;width:100%;border:1px solid var(--parchment-line);}
  .modal-card h1{font-family:var(--font-display);font-size:22px;margin:0 0 6px;color:var(--ink);}
  .modal-card p{font-size:13.5px;color:var(--ink-soft);margin:0 0 16px;line-height:1.6;}
  .modal-card label{font-size:12.5px;font-weight:800;color:var(--ink-soft);display:block;margin-bottom:6px;}
  .modal-card input[type=text]{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--parchment-line);font-family:var(--font-display);font-size:16px;margin-bottom:16px;background:#fff;color:var(--ink);}
  .swatches{display:flex;gap:10px;margin-bottom:20px;}
  .swatch{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid transparent;}
  .swatch.selected{border-color:var(--ink);}
  .modal-card .btn-start{width:100%;background:var(--accent);color:#fff;border:none;padding:12px;border-radius:10px;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 2px 0 var(--accent-deep);}
  .welcome-back .gain{font-family:var(--font-display);font-size:20px;color:var(--emerald);font-weight:700;margin:10px 0 18px;}

  @media (prefers-reduced-motion:reduce){.click-tag, .scene-flash.flashing{animation:none !important;}}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="kingdom-id">
      <span class="kingdom-name" id="kingdomNameLabel">아침의나라</span>
      <span class="age-name" id="ageLabel">마을</span>
    </div>
    <div class="stats-strip">
      <div class="stat gold">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="16" cy="16" r="11"/><rect x="12" y="12" width="8" height="8"/></svg>
        <div><div class="num" id="goldLabel">0</div><div class="sub">냥</div></div>
      </div>
      <div class="stat pop">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><circle cx="21" cy="13" r="3.4"/><path d="M5 26c0-4.5 3.4-7.5 7-7.5s7 3 7 7.5M18 26c0-3.6 2.4-6 5.5-6s5.5 2.4 5.5 6"/></svg>
        <div><div class="num" id="popLabel">0</div><div class="sub">백성</div></div>
      </div>
      <div class="stat" id="crownStat" style="display:none;">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 27 V14 Q10 8 16 8 Q22 8 22 14 V27 Z"/></svg>
        <div><div class="num" id="crownLabel">0</div><div class="sub">선정비</div></div>
      </div>
    </div>
  </div>

  <div class="scene-panel">
    <div class="scene-sky" id="sceneSky">
      <div class="stars" id="starsLayer"></div>
      <div class="hills-far"></div>
      <div class="hills-near"></div>
      <button class="castle" id="castleBtn" aria-label="궁을 눌러 세금을 걷습니다">
        <svg viewBox="0 0 150 130" fill="none">
          <rect class="wall" x="10" y="100" width="130" height="12" fill="#8a7350"/>

          <g class="stage-hut">
            <path d="M40 100 L75 70 L110 100 Z" fill="#a9895a"/>
            <rect x="48" y="100" width="54" height="26" fill="#d8c9a0"/>
            <rect x="68" y="110" width="14" height="16" fill="#5b4230"/>
          </g>

          <g class="stage-palace">
            <rect x="35" y="108" width="80" height="10" fill="#9a9282"/>
            <rect x="45" y="80" width="8" height="30" fill="#8a2a2a"/>
            <rect x="63" y="80" width="8" height="30" fill="#8a2a2a"/>
            <rect x="81" y="80" width="8" height="30" fill="#8a2a2a"/>
            <rect x="99" y="80" width="8" height="30" fill="#8a2a2a"/>
            <rect x="53" y="90" width="10" height="20" fill="#e9dfc4"/>
            <rect x="71" y="90" width="10" height="20" fill="#e9dfc4"/>
            <rect x="89" y="90" width="10" height="20" fill="#e9dfc4"/>
            <rect x="40" y="76" width="72" height="6" fill="#2f5d50"/>
            <path d="M30 76 Q75 40 122 76 Q100 66 75 66 Q50 66 30 76 Z" fill="#3a3a3a"/>
            <path d="M40 70 Q75 48 112 70" stroke="#1f1f1f" stroke-width="2" fill="none"/>
          </g>

          <g class="tower-extra">
            <path d="M14 100 Q28 84 42 100 Z" fill="#3a3a3a"/>
            <rect x="20" y="100" width="16" height="14" fill="#e9dfc4"/>
            <path d="M108 100 Q122 84 136 100 Z" fill="#3a3a3a"/>
            <rect x="114" y="100" width="16" height="14" fill="#e9dfc4"/>
          </g>

          <g class="flag">
            <line x1="75" y1="40" x2="75" y2="18" stroke="#3a2c1c" stroke-width="2"/>
            <path d="M75 18 L94 24 L75 30 Z" fill="var(--accent)"/>
          </g>
        </svg>
      </button>
    </div>
    <div class="scene-flash" id="sceneFlash"></div>
    <div class="collect-bar">
      <span class="hint">궁 앞을 눌러 세금을 걷으세요.</span>
      <button class="btn-collect" id="collectBtn">세금 징수 (+<span id="clickValueLabel">1</span>)</button>
    </div>
  </div>

  <div class="board">
    <section class="panel">
      <h2>건물 <span class="count-badge" id="buildingCountBadge">0채 보유</span></h2>
      <div class="b-list" id="buildingList"></div>
    </section>

    <section class="panel">
      <h2>교서</h2>
      <div class="u-list" id="upgradeList"></div>
    </section>
  </div>

  <div class="panel prestige-panel hidden" id="prestigePanel">
    <h2>선정비</h2>
    <div class="prestige-box">
      <div>
        <strong style="font-family:var(--font-display);font-size:15px;" id="prestigeCrownText">선정비를 세우면 0개를 얻습니다.</strong>
        <p>선정비를 세우면 왕국은 다시 마을로 돌아가지만, 세워진 선정비는 대대로 남아 온 나라의 생산력을 영구히 10%씩 늘려줍니다. 선정비는 사라지지 않습니다.</p>
      </div>
      <button class="btn-prestige" id="prestigeBtn" disabled>선정비 세우기</button>
    </div>
  </div>

  <div class="footer-row">
    <span>왕국은 몇 초마다 자동으로 저장됩니다.</span>
    <button class="link-btn" id="resetBtn">이 왕국을 버리고 처음부터 다시 시작</button>
  </div>

</div>

<div class="modal-veil" id="welcomeModal">
  <div class="modal-card">
    <h1>왕국을 세우세요</h1>
    <p>모든 나라에는 이름과 깃발이 필요합니다. 왕국의 이야기는 앞으로 계속 쓰여질 거예요.</p>
    <label for="kingdomNameInput">왕국의 이름</label>
    <input type="text" id="kingdomNameInput" maxlength="24" placeholder="예: 아침의나라">
    <label>왕실 깃발 색 (오방색)</label>
    <div class="swatches" id="swatchRow"></div>
    <button class="btn-start" id="startGameBtn">치세를 시작하기</button>
  </div>
</div>

<div class="modal-veil hidden" id="welcomeBackModal">
  <div class="modal-card welcome-back">
    <h1>자리를 비운 사이</h1>
    <p id="awayTimeText">신하들이 왕국을 잘 다스리고 있었습니다.</p>
    <div class="gain" id="awayGoldText">+0냥</div>
    <button class="btn-start" id="awayCloseBtn">왕국으로 돌아가기</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "kingdomKeepSave_kr_v1";

  /* ---------------- Config ---------------- */

  var ICONS = {
    hut: '<path d="M8 24 L20 12M18 8 L26 10 L23 18 L15 16 Z"/>',
    cottage: '<path d="M6 18 L16 8 L26 18 Z M9 18 V27 H23 V18 M14 27 V21 H18 V27"/>',
    farm: '<path d="M16 27 V9 M16 11 L10 7 M16 11 L22 7 M16 16 L9 13 M16 16 L23 13 M16 21 L10 19 M16 21 L22 19"/>',
    market: '<path d="M6 12 L16 5 L26 12 Z M8 12 V25 H24 V12 M8 21 H24 M13 25 V21 H19 V25"/>',
    quarry: '<path d="M7 25 L14 11 L19 25 Z M14 25 L20 15 L26 25 Z"/>',
    blacksmith: '<path d="M6 21 H24 L20 14 H10 Z M15 21 V26 M10 26 H22"/>',
    shrine: '<path d="M9 26 L13 18 L19 18 L23 26 Z M12 26 L15 20 L17 20 L20 26 Z M16 18 V7 M16 7 L12 11 M16 7 L20 11"/>',
    keep: '<path d="M6 27 V15 H12 V11 H10 V8 H14 V11 H12 V15 H20 V11 H18 V8 H22 V11 H20 V15 H26 V27 Z M6 27 H26"/>',
    bazaar: '<path d="M5 24 Q16 6 27 24 Z M16 6 V2 M16 2 L21 4 L16 6.5 Z"/>',
    treasury: '<path d="M6 14 Q16 5 26 14 V25 H6 Z M14 18 H18 V22 H14 Z"/>'
  };

  var BUILDINGS = [
    {id:"hut", name:"나무꾼의 오두막", desc:"나무꾼과 선녀 이야기가 전해오는 뒷산에서 땔감을 마련합니다.", baseCost:10, costMult:1.14, baseProd:0.15, unlockAt:0, hue:"emerald"},
    {id:"cottage", name:"초가집", desc:"백성들이 모여 사는 초가집입니다. 백성 수를 늘려줍니다.", baseCost:60, costMult:1.15, baseProd:0, isPop:true, unlockAt:0, hue:"gold"},
    {id:"farm", name:"다랑논", desc:"산비탈을 깎아 만든 다랑논에서 벼가 익어갑니다.", baseCost:170, costMult:1.15, baseProd:1.2, unlockAt:100, hue:"emerald"},
    {id:"market", name:"저잣거리 좌판", desc:"저잣거리에 좌판을 펴고 물건을 팝니다.", baseCost:900, costMult:1.15, baseProd:7, unlockAt:1200, hue:"gold"},
    {id:"quarry", name:"채석장", desc:"성벽과 궁궐에 쓸 돌을 캐냅니다.", baseCost:5000, costMult:1.15, baseProd:38, unlockAt:9000, hue:"emerald"},
    {id:"blacksmith", name:"대장간", desc:"풀무질 소리가 끊이지 않는 대장간입니다.", baseCost:24000, costMult:1.15, baseProd:180, unlockAt:55000, hue:"burgundy"},
    {id:"shrine", name:"성황당", desc:"고갯마루 성황당에 오가는 이들이 복을 빌며 엽전을 놓고 갑니다.", baseCost:135000, costMult:1.16, baseProd:850, unlockAt:320000, hue:"emerald"},
    {id:"keep", name:"궁궐", desc:"왕의 위엄이 서린 궁궐, 곳곳에서 진상품이 모여듭니다.", baseCost:950000, costMult:1.16, baseProd:5000, unlockAt:2200000, hue:"gold"},
    {id:"bazaar", name:"육의전", desc:"한양 육의전처럼 온 나라의 귀한 물건이 모여듭니다.", baseCost:6500000, costMult:1.17, baseProd:29000, unlockAt:16000000, hue:"burgundy"},
    {id:"treasury", name:"내탕고", desc:"왕실의 사사로운 곳간이 늘 그득하게 채워집니다.", baseCost:65000000, costMult:1.17, baseProd:175000, unlockAt:160000000, hue:"gold"}
  ];

  var UPGRADES = [
    {id:"quill", name:"명필의 붓", desc:"세금 장부를 정리하는 솜씨가 늘어, 세금 징수 시 얻는 냥이 두 배가 됩니다.", cost:250, type:"clickFlatMult", value:2},
    {id:"seal", name:"옥새", desc:"문서마다 어명의 위엄이 서려, 세금 징수 시 생산량의 3%를 추가로 거둡니다.", cost:12000, type:"clickPercent", value:0.03},
    {id:"charter", name:"보부상 인가장", desc:"전국을 누비는 보부상에게 정식 인가장을 내리니, 온 나라의 생산력이 50% 늘어납니다.", cost:55000, type:"globalMult", value:1.5},
    {id:"guild", name:"객주 연합", desc:"전국의 객주들이 연합하여 물자를 유통하니, 생산력이 두 배가 됩니다.", cost:2200000, type:"globalMult", value:2},
    {id:"blessing", name:"산신령의 가호", desc:"산신령의 가호를 입어, 온 나라의 생산력과 세금 징수액이 모두 두 배가 됩니다.", cost:45000000, type:"globalMult", value:2, alsoClick:2}
  ];

  var AGES = [
    {id:"village", name:"마을", at:0},
    {id:"town", name:"고을", at:5000},
    {id:"city", name:"도읍", at:150000},
    {id:"capital", name:"왕경", at:3000000},
    {id:"empire", name:"대제국", at:60000000}
  ];

  var ACCENTS = [
    {id:"gold", label:"황금빛 (황)", main:"#b9862f", deep:"#7c5a1f"},
    {id:"blue", label:"푸른빛 (청)", main:"#1f4e79", deep:"#12324f"},
    {id:"red", label:"붉은빛 (적)", main:"#9e2a2b", deep:"#6b1c1d"},
    {id:"black", label:"먹빛 (흑)", main:"#2b2118", deep:"#171109"}
  ];

  var PRESTIGE_UNLOCK = 100000000;

  /* ---------------- State ---------------- */

  var state = null;

  function freshState(){
    var buildings = {};
    BUILDINGS.forEach(function(b){ buildings[b.id] = 0; });
    var upgrades = {};
    UPGRADES.forEach(function(u){ upgrades[u.id] = false; });
    return {
      name: "아침의나라",
      accent: "gold",
      gold: 0,
      lifetimeGold: 0,
      buildings: buildings,
      upgrades: upgrades,
      crowns: 0,
      lastSeen: Date.now(),
      seenWelcome: false
    };
  }

  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return null;
      var parsed = JSON.parse(raw);
      var fresh = freshState();
      for(var k in fresh){ if(parsed[k] === undefined) parsed[k] = fresh[k]; }
      BUILDINGS.forEach(function(b){ if(parsed.buildings[b.id] === undefined) parsed.buildings[b.id] = 0; });
      UPGRADES.forEach(function(u){ if(parsed.upgrades[u.id] === undefined) parsed.upgrades[u.id] = false; });
      return parsed;
    }catch(e){ return null; }
  }

  function save(){
    state.lastSeen = Date.now();
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }

  /* ---------------- Derived math ---------------- */

  function buildingCost(b, owned){
    return Math.ceil(b.baseCost * Math.pow(b.costMult, owned));
  }

  function population(){
    var cottage = BUILDINGS.filter(function(b){ return b.isPop; })[0];
    return state.buildings[cottage.id];
  }

  function globalMult(){
    var mult = 1 + state.crowns * 0.1;
    UPGRADES.forEach(function(u){
      if(u.type === "globalMult" && state.upgrades[u.id]) mult *= u.value;
    });
    return mult;
  }

  function popMult(){
    return 1 + population() * 0.01;
  }

  function totalProdPerSec(){
    var sum = 0;
    BUILDINGS.forEach(function(b){
      if(b.isPop) return;
      sum += b.baseProd * state.buildings[b.id];
    });
    return sum * popMult() * globalMult();
  }

  function clickValue(){
    var flat = 1;
    var pct = 0;
    UPGRADES.forEach(function(u){
      if(!state.upgrades[u.id]) return;
      if(u.type === "clickFlatMult") flat *= u.value;
      if(u.alsoClick) flat *= u.alsoClick;
      if(u.type === "clickPercent") pct += u.value;
    });
    return flat + totalProdPerSec() * pct;
  }

  function currentAge(){
    var age = AGES[0];
    AGES.forEach(function(a){ if(state.lifetimeGold >= a.at) age = a; });
    return age;
  }

  function isUnlocked(b){
    return state.lifetimeGold >= b.unlockAt || state.gold >= b.unlockAt;
  }

  function fmt(num){
    if(num < 10000){
      var r = Math.round(num*100)/100;
      return r.toLocaleString('ko-KR', {maximumFractionDigits:2});
    }
    var n = Math.floor(num);
    var units = [[1e16,'경'],[1e12,'조'],[1e8,'억'],[1e4,'만']];
    var result = "";
    var remaining = n;
    var used = 0;
    for(var i=0;i<units.length;i++){
      var uv = units[i][0], us = units[i][1];
      if(remaining >= uv){
        var count = Math.floor(remaining/uv);
        remaining = remaining % uv;
        result += count.toLocaleString('ko-KR') + us + " ";
        used++;
        if(used >= 2) break;
      }
    }
    return result.trim();
  }

  /* ---------------- Rendering ---------------- */

  var els = {};
  ["goldLabel","popLabel","crownLabel","crownStat","ageLabel","kingdomNameLabel",
   "clickValueLabel","buildingList","upgradeList","buildingCountBadge",
   "prestigePanel","prestigeBtn","prestigeCrownText","sceneFlash","starsLayer",
   "welcomeModal","welcomeBackModal","kingdomNameInput","swatchRow","awayGoldText","awayTimeText"
  ].forEach(function(id){ els[id] = document.getElementById(id); });

  var lastAgeId = null;
  var buildingsRenderedFor = null;

  function applyAccent(){
    var acc = ACCENTS.filter(function(a){ return a.id === state.accent; })[0] || ACCENTS[0];
    document.documentElement.style.setProperty("--accent", acc.main);
    document.documentElement.style.setProperty("--accent-deep", acc.deep);
  }

  function renderHUD(){
    els.goldLabel.textContent = fmt(state.gold);
    els.popLabel.textContent = fmt(population());
    els.kingdomNameLabel.textContent = state.name;
    els.clickValueLabel.textContent = fmt(clickValue());

    if(state.crowns > 0){
      els.crownStat.style.display = "flex";
      els.crownLabel.textContent = fmt(state.crowns);
    }

    var age = currentAge();
    els.ageLabel.textContent = age.name;
    if(age.id !== lastAgeId){
      document.body.setAttribute("data-age", age.id);
      if(lastAgeId !== null) flashScene();
      lastAgeId = age.id;
    }
  }

  function flashScene(){
    els.sceneFlash.classList.remove("flashing");
    void els.sceneFlash.offsetWidth;
    els.sceneFlash.classList.add("flashing");
  }

  function renderBuildings(){
    var sig = BUILDINGS.map(function(b){ return isUnlocked(b) ? "1" : "0"; }).join("");
    if(sig === buildingsRenderedFor){ updateBuildingAffordability(); return; }
    buildingsRenderedFor = sig;

    var ownedCount = 0;
    BUILDINGS.forEach(function(b){ ownedCount += state.buildings[b.id]; });
    els.buildingCountBadge.textContent = ownedCount + "채 보유";

    var html = "";
    BUILDINGS.forEach(function(b){
      var unlocked = isUnlocked(b);
      var owned = state.buildings[b.id];
      var cost = buildingCost(b, owned);
      html += '<div class="b-card hue-'+b.hue+(unlocked?"":" locked")+'" data-id="'+b.id+'">';
      html += '<div class="b-icon"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+ICONS[b.id]+'</svg></div>';
      html += '<div class="b-info">';
      html += '<div class="b-name">'+b.name+'</div>';
      if(unlocked){
        html += '<div class="b-meta">'+b.desc+'</div>';
        html += '<div class="b-owned">'+(b.isPop ? "한 채마다 백성 1명 증가" : ("한 채당 초당 "+fmt(b.baseProd)+"냥 생산"))+' · 보유 '+owned+'채</div>';
      } else {
        html += '<div class="locked-note">누적 수입이 '+fmt(b.unlockAt)+'냥을 넘으면 지을 수 있습니다</div>';
      }
      html += '</div>';
      html += '<div class="b-buy"><button data-buy="'+b.id+'" '+(unlocked?"":"disabled")+'>짓기<br>'+fmt(cost)+'냥</button></div>';
      html += '</div>';
    });
    els.buildingList.innerHTML = html;
    updateBuildingAffordability();
  }

  function updateBuildingAffordability(){
    var buttons = els.buildingList.querySelectorAll("button[data-buy]");
    buttons.forEach(function(btn){
      var id = btn.getAttribute("data-buy");
      var b = BUILDINGS.filter(function(x){ return x.id === id; })[0];
      if(!isUnlocked(b)) return;
      var cost = buildingCost(b, state.buildings[id]);
      btn.disabled = state.gold < cost;
      btn.innerHTML = "짓기<br>"+fmt(cost)+"냥";
    });
  }

  function renderUpgrades(){
    var html = "";
    var anyVisible = false;
    UPGRADES.forEach(function(u){
      var owned = state.upgrades[u.id];
      var visible = owned || state.lifetimeGold >= u.cost * 0.15;
      if(!visible) return;
      anyVisible = true;
      html += '<div class="u-card'+(owned?" owned":"")+'">';
      html += '<div class="u-top"><div><div class="u-name">'+u.name+'</div><div class="u-desc">'+u.desc+'</div></div>';
      if(owned){
        html += '<span class="u-owned-tag">시행됨</span>';
      } else {
        html += '<button class="u-buy" data-upgrade="'+u.id+'" '+(state.gold<u.cost?"disabled":"")+'>'+fmt(u.cost)+'냥</button>';
      }
      html += '</div></div>';
    });
    if(!anyVisible){
      html = '<div class="empty-note">교서는 왕국의 곳간이 차오르면 하나씩 내려집니다.</div>';
    }
    els.upgradeList.innerHTML = html;
  }

  function updateUpgradeAffordability(){
    els.upgradeList.querySelectorAll("button[data-upgrade]").forEach(function(btn){
      var id = btn.getAttribute("data-upgrade");
      var u = UPGRADES.filter(function(x){ return x.id === id; })[0];
      btn.disabled = state.gold < u.cost;
    });
  }

  function renderPrestige(){
    if(state.lifetimeGold < PRESTIGE_UNLOCK && state.crowns === 0){
      els.prestigePanel.classList.add("hidden");
      return;
    }
    els.prestigePanel.classList.remove("hidden");
    var potential = Math.floor(Math.sqrt(state.lifetimeGold / 10000000));
    var gain = Math.max(0, potential - state.crowns);
    els.prestigeCrownText.textContent = "선정비를 세우면 "+gain+"개를 얻습니다.";
    els.prestigeBtn.disabled = gain < 1;
  }

  function renderAll(){
    renderHUD();
    renderBuildings();
    renderUpgrades();
    renderPrestige();
  }

  /* ---------------- Actions ---------------- */

  function doClick(x, y){
    var val = clickValue();
    state.gold += val;
    state.lifetimeGold += val;
    spawnClickTag(x, y, val);
  }

  function spawnClickTag(x, y, val){
    var tag = document.createElement("div");
    tag.className = "click-tag";
    tag.style.left = x + "px";
    tag.style.top = y + "px";
    tag.textContent = "+" + fmt(val);
    document.getElementById("sceneSky").appendChild(tag);
    setTimeout(function(){ tag.remove(); }, 900);
  }

  function buyBuilding(id){
    var b = BUILDINGS.filter(function(x){ return x.id === id; })[0];
    if(!b || !isUnlocked(b)) return;
    var cost = buildingCost(b, state.buildings[id]);
    if(state.gold < cost) return;
    state.gold -= cost;
    state.buildings[id] += 1;
    renderBuildings();
    renderHUD();
  }

  function buyUpgrade(id){
    var u = UPGRADES.filter(function(x){ return x.id === id; })[0];
    if(!u || state.upgrades[id] || state.gold < u.cost) return;
    state.gold -= u.cost;
    state.upgrades[id] = true;
    renderUpgrades();
    renderHUD();
  }

  function doPrestige(){
    var potential = Math.floor(Math.sqrt(state.lifetimeGold / 10000000));
    var gain = Math.max(0, potential - state.crowns);
    if(gain < 1) return;
    var total = state.crowns + gain;
    if(!confirm("지금 선정비를 세우시겠습니까? 건물과 교서는 모두 사라지지만, 앞으로 영원히 남을 선정비 "+total+"개를 갖게 됩니다 (생산력 +"+(total*10)+"%).")) return;
    state.crowns = total;
    state.gold = 0;
    state.lifetimeGold = 0;
    BUILDINGS.forEach(function(b){ state.buildings[b.id] = 0; });
    UPGRADES.forEach(function(u){ state.upgrades[u.id] = false; });
    buildingsRenderedFor = null;
    renderAll();
    save();
  }

  /* ---------------- Tick loop ---------------- */

  setInterval(function(){
    if(!state) return;
    var gain = totalProdPerSec() * 0.1;
    state.gold += gain;
    state.lifetimeGold += gain;
    renderHUD();
    updateBuildingAffordability();
    updateUpgradeAffordability();
    renderPrestige();
  }, 100);

  setInterval(function(){ if(state) save(); }, 8000);
  window.addEventListener("beforeunload", function(){ if(state) save(); });

  /* ---------------- Offline progress ---------------- */

  function applyOfflineProgress(){
    var elapsedMs = Date.now() - (state.lastSeen || Date.now());
    var elapsedSec = Math.min(elapsedMs/1000, 4*3600);
    if(elapsedSec < 30) return;
    var rate = totalProdPerSec() * 0.5;
    var gained = rate * elapsedSec;
    if(gained <= 0) return;
    state.gold += gained;
    state.lifetimeGold += gained;
    var mins = Math.round(elapsedSec/60);
    var timeText = mins < 60 ? (mins + "분") : (Math.round(mins/60*10)/10 + "시간");
    els.awayTimeText.textContent = "약 "+timeText+" 동안 자리를 비우셨습니다. 신하들이 왕국을 잘 다스리고 있었습니다.";
    els.awayGoldText.textContent = "+" + fmt(gained) + "냥";
    els.welcomeBackModal.classList.remove("hidden");
  }

  /* ---------------- Wire up ---------------- */

  document.getElementById("collectBtn").addEventListener("click", function(){
    var r = document.getElementById("sceneSky").getBoundingClientRect();
    doClick(r.width/2, r.height/2);
    renderHUD();
  });

  document.getElementById("castleBtn").addEventListener("click", function(e){
    var sky = document.getElementById("sceneSky");
    var r = sky.getBoundingClientRect();
    var x = e.clientX - r.left, y = e.clientY - r.top;
    doClick(x, y);
    renderHUD();
  });

  els.buildingList.addEventListener("click", function(e){
    var btn = e.target.closest("button[data-buy]");
    if(!btn) return;
    buyBuilding(btn.getAttribute("data-buy"));
  });

  els.upgradeList.addEventListener("click", function(e){
    var btn = e.target.closest("button[data-upgrade]");
    if(!btn) return;
    buyUpgrade(btn.getAttribute("data-upgrade"));
  });

  document.getElementById("prestigeBtn").addEventListener("click", doPrestige);

  document.getElementById("resetBtn").addEventListener("click", function(){
    if(!confirm("왕국을 완전히 지웁니다. 선정비를 포함한 모든 기록이 사라지며, 되돌릴 수 없습니다. 계속하시겠습니까?")) return;
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  });

  document.getElementById("awayCloseBtn").addEventListener("click", function(){
    els.welcomeBackModal.classList.add("hidden");
  });

  /* ---------------- Welcome / boot ---------------- */

  function buildSwatches(){
    var html = "";
    ACCENTS.forEach(function(a, i){
      html += '<div class="swatch'+(i===0?" selected":"")+'" data-accent="'+a.id+'" style="background:'+a.main+'" title="'+a.label+'" aria-label="'+a.label+'"></div>';
    });
    els.swatchRow.innerHTML = html;
    var chosen = ACCENTS[0].id;
    els.swatchRow.addEventListener("click", function(e){
      var sw = e.target.closest(".swatch");
      if(!sw) return;
      els.swatchRow.querySelectorAll(".swatch").forEach(function(s){ s.classList.remove("selected"); });
      sw.classList.add("selected");
      chosen = sw.getAttribute("data-accent");
    });
    return function(){ return chosen; };
  }

  function buildStars(){
    var html = "";
    for(var i=0;i<40;i++){
      var x = Math.random()*100, y = Math.random()*70;
      html += '<span style="left:'+x+'%;top:'+y+'%;opacity:'+(0.3+Math.random()*0.7)+'"></span>';
    }
    els.starsLayer.innerHTML = html;
  }

  function boot(){
    var existing = load();
    buildStars();

    if(existing){
      state = existing;
      applyAccent();
      document.body.setAttribute("data-age", currentAge().id);
      lastAgeId = currentAge().id;
      applyOfflineProgress();
      renderAll();
    } else {
      state = freshState();
      var getAccent = buildSwatches();
      els.welcomeModal.classList.remove("hidden");
      document.getElementById("startGameBtn").addEventListener("click", function(){
        var name = els.kingdomNameInput.value.trim();
        state.name = name.length ? name.slice(0,24) : "아침의나라";
        state.accent = getAccent();
        applyAccent();
        document.body.setAttribute("data-age", "village");
        lastAgeId = "village";
        els.welcomeModal.classList.add("hidden");
        renderAll();
        save();
      });
    }
  }

  boot();

})();
</script>
</body>
</html>
